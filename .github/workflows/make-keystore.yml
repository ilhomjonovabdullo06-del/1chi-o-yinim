name: Imzo kaliti yaratish (faqat 1 marta!)
# DIQQAT: bu workflow kalit va parollarni ARTEFAKT sifatida beradi. Repozitoriy PRIVATE (yopiq) bo'lishi SHART,
# aks holda boshqalar ham yuklab ola oladi. Yuklab olgach artefaktni DARHOL o'chiring va fayllarni xavfsiz joyda saqlang.
on:
  workflow_dispatch:
jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kalit yaratish
        run: |
          PASS=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 24)
          keytool -genkeypair -keystore boks-upload.jks -alias boks -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Boks, O=Boks, C=UZ" > /dev/null 2>&1
          base64 -w0 boks-upload.jks > KEYSTORE_BASE64.txt
          printf 'KEYSTORE_PASSWORD=%s\nKEY_PASSWORD=%s\nKEY_ALIAS=boks\n' "$PASS" "$PASS" > PAROLLAR.txt
      - uses: actions/upload-artifact@v4
        with:
          name: boks-kalit-MAXFIY
          retention-days: 1
          path: |
            boks-upload.jks
            KEYSTORE_BASE64.txt
            PAROLLAR.txt
