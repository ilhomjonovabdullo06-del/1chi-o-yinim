name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux sinovlari (o'yin, balans, tarmoq, PvP, menyu UI)
        continue-on-error: true   # sinov yiqilsa ham APK qurilsin (xato Actions'da ko'rinadi)
        run: sh tests/run.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and CMake
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: boks-apk
          path: app/build/outputs/apk/debug/app-debug.apk
