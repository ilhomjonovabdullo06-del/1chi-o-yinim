name: Release AAB (Google Play uchun)
# Qo'lda ishga tushiriladi: Actions -> "Release AAB" -> Run workflow.
# Oldindan kerak: Settings -> Secrets and variables -> Actions da 4 ta secret
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Ko'rsatma: docs/PLAY.md
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and CMake
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Imzo kalitini tayyorlash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "XATO: KEYSTORE_BASE64 secret topilmadi (docs/PLAY.md ga qarang)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/boks-upload.jks"
          echo "BOKS_KEYSTORE=$RUNNER_TEMP/boks-upload.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: AAB qurish (imzolangan)
        env:
          BOKS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BOKS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BOKS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease -PboksVersionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: boks-aab
          path: app/build/outputs/bundle/release/app-release.aab
